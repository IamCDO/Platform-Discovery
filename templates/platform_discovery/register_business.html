{% extends 'platform_discovery/base.html' %}

{% block title %}Register a business{% endblock %}

{% block content %}
<section class="section-block narrow-form">
    <div class="card form-card">
        <h2>Register your student business</h2>
        <p>Submit your application to be reviewed by the student affairs office.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="primary-btn">Submit application</button>
        </form>
    </div>
</section>
{% endblock %}
